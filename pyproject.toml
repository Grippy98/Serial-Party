[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-party"
version = "0.1.0"
description = "Shared serial consoles for Home Assistant and lab automation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Serial Party contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
  "Topic :: Terminals :: Serial",
]

[project.optional-dependencies]
test = ["aiohttp==3.14.5"]

[project.scripts]
serial-party-console = "serial_party.client:main"
serial-party-host = "serial_party.host:main"

[project.urls]
Repository = "https://github.com/Grippy98/Serial-Party"
Issues = "https://github.com/Grippy98/Serial-Party/issues"

[tool.setuptools.packages.find]
where = ["src"]
