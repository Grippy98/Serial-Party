name: Test

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y conserver-client conserver-server ttyd
          python -m pip install '.[test]' build
      - name: Host and real broker tests on simulated serial ports
        env:
          SERIAL_PARTY_REQUIRE_CONSERVER: "1"
        run: python -m unittest discover -s tests -v
      - name: Home Assistant proxy tests on simulated upstreams
        working-directory: serial_party_app
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Dashboard lifecycle tests
        run: node dashboard/tests/test-card.cjs
      - name: Build package
        run: python -m build

  app-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Home Assistant app
        run: docker build -t serial-party-app:test serial_party_app
